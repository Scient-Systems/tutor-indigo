name: Notify openedx-deploy

# This repo ALREADY has its quality gate: .github/workflows/test.yml runs
# `make test` (lint, types, format, pythonpackage), inherited from upstream
# overhangio/tutor-indigo. That file is deliberately left alone.
#
# All that was missing is telling the deploy repo a new commit is ready to be
# pinned. This runs only after "Run tests" has completed successfully on the
# release branch, so a red build never triggers a pin bump.

on:
  workflow_run:
    workflows: ["Run tests"]
    branches: [release]
    types: [completed]

jobs:
  notify:
    # workflow_run fires on completion regardless of outcome, so the result has
    # to be checked explicitly.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch
        env:
          # Scope: dispatch on openedx-deploy ONLY. Must not be able to push
          # code or read packages.
          # NOTE: this repo is PUBLIC - treat anything referenced here as
          # world-readable and keep the secret environment-scoped.
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN not set - skipping dispatch (expected until task-cicd-02)."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Scient-Systems/openedx-deploy/dispatches \
            -d "{\"event_type\":\"source-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$SHA\"}}"
