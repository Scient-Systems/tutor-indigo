name: Run tests

on:
  pull_request:
    branches: [ release, main ]
  push:
    branches: [ release, main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install .[dev]
      - name: Test lint, types, and format
        run: make test
